name: Package Telegram Web Gift Scanner

on:
  push:
    branches:
      - telegram-web-gift-scanner
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Python syntax
        run: python -m compileall -q main.py
      - name: Create source ZIP
        shell: pwsh
        run: |
          $files = @("README.md", "main.py", "requirements.txt", "config.example.json", "start.bat", ".gitignore")
          Compress-Archive -Path $files -DestinationPath "Telegram-Web-Gift-Scanner.zip" -Force
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Web-Gift-Scanner
          path: Telegram-Web-Gift-Scanner.zip
          if-no-files-found: error
          retention-days: 30
